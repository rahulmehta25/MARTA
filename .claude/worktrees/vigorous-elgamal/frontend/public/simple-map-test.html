<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Simple Mapbox Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #info { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; border-radius: 4px; z-index: 1; }
    </style>
</head>
<body>
    <div id="info">Loading map...</div>
    <div id="map"></div>
    
    <script>
        // Your token
        mapboxgl.accessToken = 'pk.eyJ1IjoicmFodWxtZWh0YTI1IiwiYSI6ImNtZXV3aWRmYzA2bTcycXB3djEzNGJhcWoifQ.GcJMoS2UY4eSQjpjIcbABA';
        
        const info = document.getElementById('info');
        
        try {
            const map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/streets-v12',
                center: [-84.3880, 33.7490],
                zoom: 12
            });
            
            map.on('load', () => {
                info.innerHTML = '✅ Map loaded successfully!';
                info.style.background = '#d4edda';
                info.style.color = '#155724';
            });
            
            map.on('error', (e) => {
                console.error('Map error:', e);
                info.innerHTML = '❌ Map error: ' + e.error.message;
                info.style.background = '#f8d7da';
                info.style.color = '#721c24';
            });
            
        } catch (error) {
            console.error('Failed to initialize:', error);
            info.innerHTML = '❌ Failed: ' + error.message;
            info.style.background = '#f8d7da';
            info.style.color = '#721c24';
        }
    </script>
</body>
</html>
