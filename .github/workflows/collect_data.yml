name: Collect MARTA Data

on:
  schedule:
    # Run every 30 minutes (free tier gives us 2000 minutes/month)
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install httpx
    
    - name: Collect and store data
      env:
        MARTA_API_KEY: ${{ secrets.MARTA_API_KEY }}
        DB_PATH: marta_data.db
      run: |
        python collect_data.py
    
    - name: Upload database
      uses: actions/upload-artifact@v3
      with:
        name: marta-database
        path: marta_data.db
        retention-days: 7  # Keep for 7 days
    
    - name: Commit database updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add marta_data.db
        git diff --staged --quiet || git commit -m "Update MARTA data [skip ci]"
        git push || echo "No changes to push"