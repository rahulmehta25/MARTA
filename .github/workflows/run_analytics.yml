name: Run Analytics Engine

on:
  schedule:
    # Run every hour at minute 30
    - cron: '30 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  analytics:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn scipy joblib
          pip install httpx python-dotenv supabase
      
      - name: Run Analytics Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MARTA_API_KEY: ${{ secrets.MARTA_API_KEY }}
        run: |
          echo "🔬 Running MARTA Analytics Engine..."
          echo "=================================================="
          
          # Run analytics engine
          python analytics_engine.py
          
          echo "=================================================="
          echo "✅ Analytics run completed"
      
      - name: Train ML Models (Weekly)
        if: github.event.schedule == '0 2 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MARTA_API_KEY: ${{ secrets.MARTA_API_KEY }}
        run: |
          echo "🤖 Training ML Models..."
          echo "=================================================="
          
          # Train ML models
          python ml_models.py
          
          echo "=================================================="
          echo "✅ ML model training completed"