name: MARTA Platform CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  POSTGRES_VERSION: '15'

jobs:
  # ============================================================================
  # Code Quality and Linting
  # ============================================================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy isort bandit safety
        pip install -r requirements.txt

    - name: Run Black code formatting check
      run: |
        black --check --diff src/ tests/
        echo "✅ Black formatting check passed"

    - name: Run isort import sorting check
      run: |
        isort --check-only --diff src/ tests/
        echo "✅ Import sorting check passed"

    - name: Run Flake8 linting
      run: |
        flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503
        echo "✅ Flake8 linting passed"

    - name: Run MyPy type checking
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional
        echo "✅ Type checking passed"

    - name: Run Bandit security check
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ --severity-level medium
        echo "✅ Security check passed"

    - name: Check for known security vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check
        echo "✅ Dependency security check passed"

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # ============================================================================
  # Unit Tests
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist pytest-mock
        pip install -r requirements.txt

    - name: Run unit tests
      env:
        TESTING: true
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest tests/unit/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --junitxml=pytest-results.xml \
          --maxfail=10 \
          -v \
          --tb=short \
          -n auto
        echo "✅ Unit tests passed with 80%+ coverage"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results-${{ matrix.python-version }}
        path: |
          pytest-results.xml
          htmlcov/
          coverage.xml

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_marta_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio
        pip install -r requirements.txt

    - name: Set up test database
      env:
        PGPASSWORD: test_password
      run: |
        psql -h localhost -U test_user -d test_marta_db -c "CREATE EXTENSION IF NOT EXISTS postgis;"
        echo "✅ Test database configured"

    - name: Run database migrations
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test_marta_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        TESTING: true
      run: |
        python -c "
        from src.database.migration_manager import MigrationManager
        config = {
            'host': 'localhost',
            'port': 5432,
            'database': 'test_marta_db',
            'user': 'test_user',
            'password': 'test_password'
        }
        manager = MigrationManager(config)
        print('Database migrations completed')
        "

    - name: Run integration tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test_marta_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        TESTING: true
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest tests/integration/ \
          --cov=src \
          --cov-append \
          --cov-report=xml \
          --junitxml=integration-results.xml \
          --maxfail=5 \
          -v \
          --tb=short
        echo "✅ Integration tests passed"

    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: |
          integration-results.xml
          coverage.xml

  # ============================================================================
  # End-to-End Tests
  # ============================================================================
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_marta_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest selenium pytest-asyncio
        pip install -r requirements.txt

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Install Chrome for testing
      run: |
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install ChromeDriver
      run: |
        CHROME_VERSION=$(google-chrome --version | cut -d " " -f3 | cut -d "." -f1-3)
        CHROMEDRIVER_VERSION=$(curl -s https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION})
        wget -O /tmp/chromedriver.zip https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip
        sudo unzip /tmp/chromedriver.zip chromedriver -d /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver

    - name: Start backend services
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test_marta_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        TESTING: true
      run: |
        python run_api.py &
        sleep 10
        echo "✅ Backend services started"

    - name: Start frontend development server
      run: |
        cd frontend
        npm start &
        sleep 15
        echo "✅ Frontend development server started"

    - name: Run end-to-end tests
      env:
        TESTING: true
        PYTHONPATH: ${{ github.workspace }}
        SELENIUM_HEADLESS: true
      run: |
        pytest tests/e2e/ \
          --junitxml=e2e-results.xml \
          --maxfail=3 \
          -v \
          --tb=short \
          -k "not slow"
        echo "✅ End-to-end tests passed"

    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: |
          e2e-results.xml

    - name: Upload screenshots on failure
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: e2e-screenshots
        path: tests/e2e/screenshots/

  # ============================================================================
  # Performance Tests
  # ============================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[performance]')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark memory-profiler
        pip install -r requirements.txt

    - name: Run performance tests
      env:
        TESTING: true
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest tests/performance/ \
          --benchmark-json=benchmark-results.json \
          --junitxml=performance-results.xml \
          -v \
          --tb=short \
          -m "performance and not slow"
        echo "✅ Performance tests completed"

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-results
        path: |
          benchmark-results.json
          performance-results.xml

    - name: Performance regression check
      run: |
        python -c "
        import json
        with open('benchmark-results.json', 'r') as f:
            data = json.load(f)
        
        benchmarks = data['benchmarks']
        for bench in benchmarks:
            name = bench['name']
            time = bench['stats']['mean']
            print(f'{name}: {time:.4f}s average')
            
            # Set performance thresholds
            thresholds = {
                'test_optimization_performance': 2.0,
                'test_simulation_performance': 5.0,
                'test_api_response_time': 0.5
            }
            
            for threshold_name, max_time in thresholds.items():
                if threshold_name in name and time > max_time:
                    print(f'❌ Performance regression: {name} took {time:.4f}s (max: {max_time}s)')
                    exit(1)
        
        print('✅ No performance regressions detected')
        "

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        languages: python

  # ============================================================================
  # Build and Package
  # ============================================================================
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel
        pip install -r requirements.txt

    - name: Build Python package
      run: |
        python -m build
        echo "✅ Python package built"

    - name: Install and build frontend
      run: |
        cd frontend
        npm ci
        npm run build
        echo "✅ Frontend built"

    - name: Build Docker image
      run: |
        docker build -t marta-platform:${{ github.sha }} .
        echo "✅ Docker image built"

    - name: Run container smoke test
      run: |
        docker run --rm -d --name marta-test -p 8001:8001 marta-platform:${{ github.sha }}
        sleep 10
        
        # Test health endpoint
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health)
        if [ "$response" = "200" ]; then
          echo "✅ Container smoke test passed"
        else
          echo "❌ Container smoke test failed (HTTP $response)"
          exit 1
        fi
        
        docker stop marta-test

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          dist/
          frontend/build/

  # ============================================================================
  # Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add actual deployment commands here
        echo "✅ Deployment to staging completed"

    - name: Run staging smoke tests
      run: |
        echo "🧪 Running staging smoke tests..."
        # Add staging verification tests here
        echo "✅ Staging smoke tests passed"

    - name: Notify deployment
      if: always()
      run: |
        echo "📢 Staging deployment notification sent"
        # Add notification logic (Slack, email, etc.)

  # ============================================================================
  # Deploy to Production
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, integration-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        # Add actual production deployment commands here
        echo "✅ Deployment to production completed"

    - name: Run production smoke tests
      run: |
        echo "🧪 Running production smoke tests..."
        # Add production verification tests here
        echo "✅ Production smoke tests passed"

    - name: Notify deployment
      if: always()
      run: |
        echo "📢 Production deployment notification sent"
        # Add notification logic (Slack, email, etc.)

  # ============================================================================
  # Nightly Tests (Extended Test Suite)
  # ============================================================================
  nightly-tests:
    name: Nightly Extended Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 120

    strategy:
      matrix:
        test-type: [load, performance, security, compatibility]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark locust
        pip install -r requirements.txt

    - name: Run nightly tests
      env:
        TESTING: true
        PYTHONPATH: ${{ github.workspace }}
        NIGHTLY_TESTS: true
      run: |
        case "${{ matrix.test-type }}" in
          load)
            echo "🚀 Running load tests..."
            pytest tests/performance/test_load_testing.py -v -m "load_test"
            ;;
          performance)
            echo "🚀 Running performance benchmarks..."
            pytest tests/performance/ -v -m "benchmark"
            ;;
          security)
            echo "🚀 Running security tests..."
            pytest tests/ -v -m "security"
            ;;
          compatibility)
            echo "🚀 Running compatibility tests..."
            pytest tests/ -v -m "compatibility"
            ;;
        esac
        echo "✅ Nightly ${{ matrix.test-type }} tests completed"

    - name: Upload nightly test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: nightly-${{ matrix.test-type }}-results
        path: |
          test-results.xml
          benchmark-results.json

  # ============================================================================
  # Cleanup and Reporting
  # ============================================================================
  cleanup-and-report:
    name: Cleanup and Generate Reports
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, integration-tests, build]
    if: always()
    timeout-minutes: 10

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate test report
      run: |
        echo "📊 Generating comprehensive test report..."
        
        echo "## MARTA Platform CI/CD Report" > test-report.md
        echo "**Build:** ${{ github.sha }}" >> test-report.md
        echo "**Branch:** ${{ github.ref }}" >> test-report.md
        echo "**Timestamp:** $(date -u)" >> test-report.md
        echo "" >> test-report.md
        
        # Add test results summary
        echo "### Test Results Summary" >> test-report.md
        if [ -f "unit-test-results-3.11/pytest-results.xml" ]; then
          echo "✅ Unit tests passed" >> test-report.md
        else
          echo "❌ Unit tests failed" >> test-report.md
        fi
        
        if [ -f "integration-test-results/integration-results.xml" ]; then
          echo "✅ Integration tests passed" >> test-report.md
        else
          echo "❌ Integration tests failed" >> test-report.md
        fi
        
        echo "✅ Test report generated"

    - name: Upload final report
      uses: actions/upload-artifact@v3
      with:
        name: final-test-report
        path: test-report.md

    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          if (fs.existsSync('test-report.md')) {
            const report = fs.readFileSync('test-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
          }

# ============================================================================
# Additional Workflow Configurations
# ============================================================================
env:
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  
defaults:
  run:
    shell: bash